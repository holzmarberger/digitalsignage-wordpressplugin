<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klickdummy Empfangsdisplay – Holz Marberger</title>
<style>
:root{--green:#006729;--green-d:#004f1f;--green-l:#e3f0e7;--red:#922224;--text:#1f2421;--muted:#5d6660;--line:#d6d9d7;--warn:#b86e00;--warn-l:#fff3df;--info:#1f5fa8;--info-l:#e8f0fa;--bg:#f4f6f5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#2b302d;font-family:Poppins,"TeX Gyre Heros",Arial,sans-serif;color:var(--text)}
button{font-family:inherit;cursor:pointer}
/* Toolbar (nur Dummy) */
#tb{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:10px 16px;background:#1c201e;color:#dfe5e1;font-size:13px}
#tb b{color:#fff;margin-right:8px}
#tb .grp{display:flex;gap:6px;align-items:center}
#tb button,#tb select{background:#333a36;color:#fff;border:1px solid #4a524d;border-radius:6px;padding:5px 10px;font-size:13px}
#tb button.on{background:var(--green);border-color:var(--green)}
#tb label{display:flex;gap:5px;align-items:center}
#stage{position:relative;display:flex;gap:24px;justify-content:center;align-items:flex-start;padding:16px}
#dispWrap{position:relative;flex:none;box-shadow:0 0 0 10px #111,0 10px 40px rgba(0,0,0,.6);border-radius:4px;overflow:hidden}
body.kiosk #tb{display:none}
body.kiosk #stage{padding:0}
body.kiosk #dispWrap{box-shadow:none;border-radius:0}
body.kiosk #phoneWrap{display:none!important}
/* Display */
#screen{position:absolute;top:0;left:0;transform-origin:0 0;background:var(--bg);overflow:hidden;user-select:none}
.gz{position:absolute;left:0;right:0;top:0;background:#fff;border-bottom:14px solid var(--green);display:grid}
.hoch .gz{height:480px;grid-template-columns:1fr auto;grid-template-rows:auto 1fr;padding:36px 60px 30px}
.quer .gz{height:270px;grid-template-columns:auto 1fr auto;align-items:center;padding:30px 60px;gap:50px}
.logo-card img{height:130px;display:block}
.quer .logo-card img{height:180px}
.logo-fallback{font-weight:700;font-size:54px;color:var(--green);letter-spacing:-1px}
.wx{white-space:nowrap;display:flex;align-items:center;gap:22px;justify-self:end;color:var(--muted)}
.wx svg{width:96px;height:96px}
.wx .t{font-size:52px;font-weight:600;color:var(--text);line-height:1}
.wx .c{font-size:44px;font-weight:600;color:var(--text);line-height:1;padding-left:22px;border-left:3px solid var(--line)}
.gz .txt{align-self:end}
.hoch .gz .txt{grid-column:1/3}
.gz h1{margin:0;font-size:76px;line-height:1.08;font-weight:700;color:var(--green)}
.quer .gz h1{font-size:64px}
.gz .date{font-size:38px;color:var(--muted);margin-top:12px}
/* Gruß aktiv */
.gz.guest{background:linear-gradient(135deg,var(--green) 0%,var(--green-d) 100%);color:#fff;border-bottom-color:var(--red)}
.gz.guest h1{color:#fff}
.gz.guest .date,.gz.guest .wx,.gz.guest .wx .t,.gz.guest .wx .c{color:#fff;border-color:rgba(255,255,255,.35)}
.hoch .gz.guest{grid-template-columns:auto 1fr;grid-template-rows:1fr auto;gap:10px 40px;align-items:center}
.hoch .gz.guest .txt{grid-column:auto;align-self:center}
.hoch .guest h1{font-size:64px}
.hoch .guest .sub{font-size:30px}
.guest-logo{background:#fff;border-radius:22px;width:230px;height:230px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:16px}
.quer .guest-logo{width:200px;height:200px}
.guest-logo img{max-width:100%;max-height:100%}
.guest .kicker{font-size:40px;opacity:.9;font-weight:500}
.guest h1{font-size:72px}
.quer .guest h1{font-size:62px}
.guest .sub{font-size:34px;margin-top:10px;opacity:.95}
.guest-meta{display:flex;justify-content:space-between;align-items:center;font-size:30px}
.hoch .guest-meta{grid-column:1/3;border-top:2px solid rgba(255,255,255,.25);padding-top:18px}
.quer .guest-meta{flex-direction:column;align-items:flex-end;gap:14px}
.guest-meta .wx svg{width:64px;height:64px}
.guest-meta .wx .t,.guest-meta .wx .c{font-size:36px}
/* Hauptbereich */
.nv{position:absolute;left:0;right:0;bottom:0;padding:56px 60px 40px;display:flex;flex-direction:column}
.hoch .nv{top:494px}
.quer .nv{top:284px;padding:36px 60px 30px}
.nv h2{margin:0;font-size:84px;font-weight:700;line-height:1.05}
.quer .nv h2{font-size:64px}
.nv .lead{font-size:38px;color:var(--muted);margin:10px 0 0}
.quer .nv .lead{font-size:30px}
.tiles{display:grid;gap:36px;flex:1;margin:50px 0 36px}
.hoch .tiles{grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr);margin:40px 0 30px}
.tiles{min-height:0}.tile{overflow:hidden;height:100%}
.quer .tiles{grid-template-rows:minmax(0,1fr)}
.quer .tiles{grid-template-columns:repeat(4,1fr);margin:32px 0 26px;gap:30px}
.tile{background:#fff;border:3px solid var(--line);border-radius:28px;padding:40px 36px;text-align:left;display:flex;flex-direction:column;justify-content:flex-start;transition:transform .08s,background .08s;box-shadow:0 6px 0 var(--line)}
.tile:active{transform:translateY(4px) scale(.99);background:var(--green-l);box-shadow:0 2px 0 var(--line)}
.tile .ic{width:150px;height:150px;border-radius:50%;background:var(--green-l);display:flex;align-items:center;justify-content:center}
.quer .tile .ic{width:120px;height:120px}
.tile .ic{flex:none}
.tile .tt{hyphens:manual}
.tile .ic svg{width:60%;height:60%}
.tile .tt{font-size:52px;font-weight:700;line-height:1.1;color:var(--text);margin-top:36px}
.quer .tile .tt{font-size:42px}
.tile .st{font-size:30px;color:var(--muted);margin-top:12px;line-height:1.3}
.quer .tile .st{font-size:24px}
.tile{position:relative;padding-bottom:96px!important}
.tile .go{font-size:30px;font-weight:600;color:var(--green);position:absolute;left:36px;bottom:36px}
.hoch .tile{padding:32px 32px}
.hoch .tile .ic{width:120px;height:120px}
.hoch .tile .tt{margin-top:24px}
.foot{display:flex;justify-content:space-between;align-items:center}
.langs{display:flex;gap:18px}
.langs button{min-width:170px;padding:0 48px;height:100px;border-radius:50px;border:3px solid var(--line);background:#fff;font-size:38px;font-weight:600;color:var(--muted)}
.langs button.on{background:var(--green);border-color:var(--green);color:#fff}
.hint{font-size:30px;color:var(--muted)}
/* Detail */
.back{white-space:nowrap;flex:none;height:120px;padding:0 50px;border-radius:60px;border:3px solid var(--green);background:#fff;color:var(--green);font-size:42px;font-weight:600;align-self:flex-start}
.back:active{background:var(--green-l)}
.dhead{display:flex;align-items:center;gap:36px}
.dhead h2{font-size:70px}
.quer .dhead h2{font-size:56px}
.dbody{flex:1;display:grid;gap:36px;margin-top:40px;min-height:0}
.hoch .dbody{grid-template-rows:auto 1fr auto}
.quer .dbody{grid-template-columns:1.25fr 1fr;grid-template-rows:1fr auto;margin-top:26px;gap:30px}
.video{position:relative;background:#fff;border-radius:24px;border:3px solid var(--line);overflow:hidden;aspect-ratio:16/9}
.quer .video{grid-row:1/3;aspect-ratio:auto}
.video svg,.video img,.video video{width:100%;height:100%;display:block;object-fit:contain;background:#fff}
.hoch .dbody.novid{grid-template-rows:1fr auto}
.quer .dbody.novid{grid-template-columns:1fr;grid-template-rows:1fr auto}
.novid .steps ol{font-size:44px}.quer .novid .steps ol{font-size:34px}
.tag{position:absolute;top:18px;right:18px;background:var(--warn-l);color:var(--warn);border-left:6px solid var(--warn);font-size:22px;padding:8px 14px;border-radius:6px}
.steps{background:#fff;border-radius:24px;border:3px solid var(--line);padding:34px 40px;overflow:hidden}
.steps ol{margin:0;padding-left:56px;font-size:34px;line-height:1.4}
.quer .steps ol{font-size:26px}.quer .steps .contact{font-size:24px}
.steps li{margin-bottom:8px}
.steps li::marker{color:var(--green);font-weight:700}
.steps .contact{margin-top:20px;padding-top:20px;border-top:2px solid var(--line);font-size:30px;color:var(--muted)}
.steps .contact b{color:var(--text)}
.actions{display:grid;grid-template-columns:1fr auto;gap:30px;align-items:stretch}
.call{border:none;border-radius:28px;background:var(--green);color:#fff;font-size:44px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:24px;min-height:170px}
.quer .call{font-size:36px;min-height:150px}
.call:active{background:var(--green-d)}
.call svg{width:64px;height:64px}
.qr{background:#fff;border-radius:24px;border:3px solid var(--line);padding:18px;display:flex;gap:18px;align-items:center;font-size:24px;color:var(--muted);max-width:420px}
.qr svg{width:130px;height:130px;flex:none}
.ph{display:inline-block;font-size:.6em;background:var(--warn-l);color:var(--warn);padding:2px 10px;border-radius:5px;vertical-align:middle;font-weight:500}
/* Takeover */
.takeover{position:absolute;inset:0;background:linear-gradient(160deg,var(--green) 0%,var(--green-d) 100%);color:#fff;padding:70px 64px 50px;display:flex;flex-direction:column;z-index:5}
.quer .takeover{padding:44px 64px 34px}
.to-head{display:flex;justify-content:space-between;align-items:center}
.to-head .logo-card{background:#fff;padding:18px 26px;border-radius:18px}
.to-head .logo-card img{height:120px}
.to-head .dt{font-size:36px;text-align:right}
.takeover h1{font-size:104px;line-height:1.05;margin:70px 0 40px}
.quer .takeover h1{font-size:76px;margin:34px 0 26px}
.to-cards{display:grid;gap:30px;flex:1;align-content:start}
.quer .to-cards{grid-template-columns:1fr 1fr 1fr}
.to-card{background:#fff;color:var(--text);border-radius:24px;padding:34px 40px;font-size:36px;line-height:1.35;border-left:14px solid var(--red)}
.quer .to-card{font-size:28px}
.to-card h3{margin:0 0 10px;font-size:42px;color:var(--green)}
.quer .to-card h3{font-size:34px}
.to-card .img{height:220px;margin-top:18px;border-radius:14px;background:repeating-linear-gradient(45deg,#eef1ef,#eef1ef 16px,#e2e7e4 16px,#e2e7e4 32px);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:26px}
.visitor{white-space:nowrap;margin-top:30px;align-self:center;height:130px;padding:0 70px;border-radius:65px;border:none;background:#fff;color:var(--green);font-size:38px;font-weight:700;box-shadow:0 8px 0 rgba(0,0,0,.2)}
.quer .visitor{height:110px;font-size:36px;margin-top:20px}
/* Info-Display */
.iv{position:absolute;inset:0;background:#0f1210;display:flex;flex-direction:column}
.ih{flex:none;height:140px;background:#fff;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:40px;padding:0 44px;border-bottom:10px solid var(--green)}
.hoch .ih{height:190px;gap:24px;padding:0 30px}
.hoch .ih .wx .c{display:none}
.ih .logo-card img{height:104px}
.ih .wx svg{width:72px;height:72px}.ih .wx .t,.ih .wx .c{font-size:40px}
.ititle b{display:block;font-size:44px;color:var(--green);line-height:1.1}
.hoch .ititle b{font-size:38px}
.dots{display:flex;gap:10px;margin-top:12px}.dots i{width:14px;height:14px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--green);width:40px;border-radius:7px}
.ibar{flex:none;height:6px;background:#1d221f}.ibar i{display:block;height:100%;background:#73bf69;width:0;animation:bar linear forwards}
@keyframes bar{to{width:100%}}
.iz{flex:1;min-height:0;padding:22px}
.izin{height:100%;display:flex;flex-direction:column}
.izs{flex:1;min-height:0;position:relative}
.iz .notice{margin-bottom:18px}
.it{flex:none;height:90px;background:var(--green);color:#fff;display:flex;align-items:center;overflow:hidden}
.hoch .it{height:110px}
.itl{flex:none;background:var(--red);height:100%;display:flex;align-items:center;padding:0 34px;font-weight:700;font-size:34px;letter-spacing:2px}
.itt{flex:1;overflow:hidden;white-space:nowrap}
.marq{display:inline-flex;animation:mq 28s linear infinite}
.marq span{font-size:36px;font-weight:500;padding-right:0}
.marq em{font-style:normal;color:#9fd3ad;margin:0 34px}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.graf{position:absolute;inset:0;background:#181b1f;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px;color:#ccccdc;font-family:Inter,Arial,sans-serif}
.gtop{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;flex:none}
.hoch .gtop{grid-template-columns:1fr 1fr}
.gmain{flex:1;min-height:0;display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.hoch .gmain{grid-template-columns:1fr;grid-template-rows:1.3fr 1fr}
.gp{background:#22252b;border:1px solid #2f3238;border-radius:6px;padding:14px 18px;overflow:hidden}
.gpt{font-size:22px;font-weight:600;color:#d8d9da;margin-bottom:10px}
.gpv{font-size:62px;font-weight:600;line-height:1}
.gp table{width:100%;border-collapse:collapse;font-size:26px}
.gp th{text-align:left;color:#8e8e8e;font-weight:500;border-bottom:1px solid #34373d;padding:8px}
.gp td{padding:12px 8px;border-bottom:1px solid #2c2f35}
.gp tr.hl td{background:rgba(0,103,41,.45);color:#fff;font-weight:600}
.bar{display:grid;grid-template-columns:150px 1fr 80px;align-items:center;gap:12px;margin:18px 0;font-size:22px}
.bt{display:flex;height:34px;background:#2c2f35;border-radius:3px;overflow:hidden}.bt i{display:block;height:100%}
.bar b{text-align:right}
.graf .tag,.islide .tag{top:auto;bottom:24px;right:24px}
.islide{position:absolute;inset:0;background:#fff;border-radius:16px;padding:56px 64px;color:var(--text)}
.islide h2{font-size:72px;margin:0 0 30px;color:var(--green);line-height:1.1}
.islide.news{display:grid;grid-template-columns:1fr 1.2fr;gap:56px;align-items:center}
.hoch .islide.news{grid-template-columns:1fr;grid-template-rows:auto 1fr;align-items:start}
.nimg{height:100%;min-height:300px;border-radius:14px;background:repeating-linear-gradient(45deg,#eef1ef,#eef1ef 18px,#e2e7e4 18px,#e2e7e4 36px);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:28px;overflow:hidden}
.nimg img{width:100%;height:100%;object-fit:cover}
.nk{font-size:26px;font-weight:700;color:var(--red);letter-spacing:1px;margin-bottom:16px}
.islide.news p{font-size:38px;line-height:1.4;margin:0}
.nd{margin-top:30px;font-size:26px;color:var(--muted)}
.islide.page .pc{display:grid;grid-template-columns:1.3fr 1fr;gap:50px;font-size:36px;line-height:1.45}
.hoch .islide.page .pc{grid-template-columns:1fr}
.islide.page p{margin:0 0 22px}
.pimg{border-radius:14px;background:repeating-linear-gradient(45deg,#eef1ef,#eef1ef 18px,#e2e7e4 18px,#e2e7e4 36px);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:26px;min-height:300px}
/* Hinweis-Banner */
.notice{display:flex;align-items:center;gap:30px;background:var(--warn-l);border:4px solid var(--warn);border-radius:24px;padding:22px 30px;margin-bottom:36px;flex:none}
.quer .notice{padding:12px 24px;margin-bottom:20px;gap:22px}
.notice .ni{flex:none;width:110px;height:110px;border-radius:50%;background:var(--warn);display:flex;align-items:center;justify-content:center}
.quer .notice .ni{width:72px;height:72px}
.notice .ni svg{width:62%;height:62%}
.notice b{display:block;font-size:40px;line-height:1.2;color:var(--text)}
.quer .notice b{font-size:32px}
.notice span{display:block;font-size:28px;color:var(--muted);margin-top:4px}
.quer .notice span{font-size:22px}
.notice.sm{padding:12px 22px;margin-bottom:24px;gap:20px;border-width:3px}
.notice.sm .ni{width:64px;height:64px}
.notice.sm b{font-size:30px}
.notice.sm span{font-size:22px}
.quer .hasn .lead{display:none}
.hoch .hasn .lead{display:none}
.hoch .hasn .tile .st{display:none}
.hoch .hasn2 .tile{padding-bottom:32px!important}
.hoch .hasn2 .tile .go{display:none}
.hoch .hasn2 .notice{padding:16px 24px;margin-bottom:20px}.hoch .hasn2 .notice .ni{width:84px;height:84px}.hoch .hasn2 .notice b{font-size:34px}.hoch .hasn2 .notice span{font-size:24px}
.quer .tile{padding:28px 30px;padding-bottom:72px!important}
.quer .tile .ic{width:90px;height:90px}
.quer .tile .tt{margin-top:20px}
.quer .tile .go{bottom:24px;left:30px}
.hoch .cmp-head h2{font-size:50px;white-space:nowrap}
/* Gruß im unteren Bereich */
.guest-card{flex:1;min-height:0;background:linear-gradient(135deg,var(--green),var(--green-d));color:#fff;border-radius:32px;border-bottom:14px solid var(--red);display:flex;align-items:center;gap:50px;padding:40px 56px;margin-bottom:36px;overflow:hidden}
.hoch .guest-card{flex-direction:column;justify-content:center;text-align:center;gap:34px}
.guest-card .guest-logo{flex:none;width:240px;height:240px}
.hoch .guest-card .guest-logo{width:270px;height:270px}
.quer .guest-card .guest-logo{width:210px;height:210px}
.guest-card .kicker{font-size:44px;opacity:.9;font-weight:500}
.guest-card h1{margin:6px 0 0;font-size:82px;line-height:1.08;color:#fff}
.quer .guest-card h1{font-size:68px}
.guest-card .sub{font-size:36px;margin-top:14px;opacity:.95}
.quer .guest-card .sub{font-size:30px}
.cmp-head{display:flex;justify-content:space-between;align-items:center;gap:20px;flex:none}
.cmp-head h2{font-size:56px}
.quer .cmp-head h2{font-size:44px}
.cmp-head .langs button{height:84px;font-size:30px;padding:0 34px;min-width:0}
.quer .cmp-head .langs button{height:72px}
.tiles.compact{flex:none;grid-template-columns:repeat(4,1fr)!important;grid-template-rows:auto!important;margin:24px 0 0;gap:22px}
.tiles.compact .tile{height:auto;padding:26px 16px!important;align-items:center;text-align:center;box-shadow:0 5px 0 var(--line)}
.tiles.compact .tile .ic{width:100px;height:100px}
.tiles.compact .tile .tt{font-size:30px;margin-top:16px}
.quer .tiles.compact .tile{flex-direction:row;text-align:left;gap:18px;padding:20px 22px!important}
.quer .tiles.compact .tile .ic{width:80px;height:80px}
.quer .tiles.compact .tile .tt{margin-top:0}
.ph-tabs{display:flex;border-bottom:1.5px solid var(--line);position:sticky;top:62px;background:#fff;z-index:2}
.ph-tabs button{flex:1;background:none;border:none;padding:12px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
.ph-tabs button.on{color:var(--green);border-bottom-color:var(--green)}
.chip.ic{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;padding:0}
.chip.ic svg{width:22px;height:22px}
.chip.ic.on svg{stroke:#fff}
/* Geschlossen */
.closed{background:linear-gradient(160deg,#1f2421 0%,#0f2a19 100%)}
.closed h1{margin-bottom:10px}
.closed .en{font-size:44px;opacity:.75;margin-bottom:40px}
.quer .closed .en{font-size:34px;margin-bottom:20px}
.closed .next{font-size:40px;line-height:1.35;border-left:10px solid var(--green);padding-left:30px;margin-bottom:46px}
.closed .next span{opacity:.75;font-size:.8em}
.quer .closed .next{font-size:32px;margin-bottom:24px}
.oh{background:#fff;color:var(--text);border-radius:24px;padding:36px 44px}
.quer .oh{padding:24px 36px}
.oh h3{margin:0 0 16px;font-size:40px;color:var(--green)}
.quer .oh h3{font-size:32px;margin-bottom:8px}
.oh table{width:100%;border-collapse:collapse;font-size:34px}
.quer .oh table{font-size:28px}
.oh td{padding:18px 0;border-bottom:2px solid var(--line);vertical-align:top}
.quer .oh td{padding:10px 0}
.oh td:last-child{text-align:right;font-weight:600;white-space:nowrap;padding-left:20px}
.hoch .oh table{font-size:30px}
.quer .closed .br{display:none}
.quer .closed h1{font-size:68px;margin:22px 0 4px}
.quer .closed .oh td span{display:none}
.oh td span{font-size:.75em;color:var(--muted)}
.oh tr.today td{color:var(--green)}
.ohn{font-size:24px;color:var(--muted);margin-top:16px}
.closed .visitor{margin-top:auto;color:#1f2421}
.holiday .hmsg{font-size:46px;line-height:1.3;margin-bottom:30px}
.holiday .hmsg span{display:block;font-size:.7em;opacity:.75;margin-top:8px}
.holiday .himg{flex:1;min-height:200px;max-height:520px;border-radius:24px;border:3px dashed rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:30px;opacity:.8;margin-bottom:40px}
.quer .holiday .hmsg{font-size:36px;margin-bottom:16px}
.quer .holiday .himg{min-height:120px;margin-bottom:20px}
/* Overlays */
.ring{position:absolute;right:40px;bottom:40px;z-index:9;background:rgba(31,36,33,.88);color:#fff;border-radius:60px;padding:16px 34px 16px 18px;display:flex;align-items:center;gap:20px;font-size:30px}
.ring svg{width:80px;height:80px}
.call-ov{position:absolute;inset:0;background:rgba(20,24,22,.82);z-index:8;display:flex;align-items:center;justify-content:center}
.call-box{background:#fff;border-radius:32px;padding:60px;width:80%;max-width:900px;text-align:center}
.call-box .pulse{width:200px;height:200px;margin:0 auto 30px;border-radius:50%;background:var(--green-l);display:flex;align-items:center;justify-content:center;animation:p 1.4s infinite}
.call-box .pulse svg{width:100px;height:100px}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(0,103,41,.45)}100%{box-shadow:0 0 0 60px rgba(0,103,41,0)}}
.call-box h3{font-size:52px;margin:0 0 14px}
.call-box p{font-size:30px;color:var(--muted);margin:0 0 30px}
.note{background:var(--info-l);border-left:8px solid var(--info);color:var(--info);text-align:left;padding:18px 24px;border-radius:8px;font-size:24px;margin-bottom:34px}
.hang{height:120px;padding:0 80px;border-radius:60px;border:none;background:var(--red);color:#fff;font-size:42px;font-weight:600}
/* Phone / Pflegemaske */
#phoneWrap{flex:none;width:390px;height:800px;background:#111;border-radius:44px;padding:12px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
#phone .logo-fallback{font-size:26px}
#phone{width:100%;height:100%;background:#fff;border-radius:34px;overflow-y:auto;font-size:15px;position:relative}
.ph-top{background:var(--green);color:#fff;padding:22px 18px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:2}
.ph-top h4{margin:0;font-size:18px}
.ph-top button{background:#fff;color:var(--green);border:none;border-radius:8px;padding:8px 12px;font-weight:600;font-size:14px}
.ph-body{padding:16px}
.ph-body label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px;font-weight:500}
.ph-body input[type=text],.ph-body input[type=password],.ph-body input[type=date],.ph-body input[type=time]{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;font-size:15px;font-family:inherit}
.ph-body input:focus{outline:none;border-color:var(--green)}
.btn{width:100%;padding:13px;border:none;border-radius:10px;background:var(--green);color:#fff;font-weight:600;font-size:16px;margin-top:16px}
.btn.sec{background:#fff;color:var(--muted);border:1.5px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--green);color:var(--green);background:#fff;border-radius:20px;padding:7px 12px;font-size:13px;font-weight:500}
.chip.on{background:var(--green);color:#fff}
.gcard{border:1.5px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:12px;margin-bottom:10px;align-items:center}
.gcard .th{width:52px;height:52px;border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.gcard .th img{max-width:100%;max-height:100%}
.gcard .in{flex:1;min-width:0}
.gcard .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .zt{font-size:12px;color:var(--muted)}
.st-chip{font-size:11px;font-weight:600;padding:3px 8px;border-radius:10px;display:inline-block;margin-top:4px}
.st-run{background:var(--green-l);color:var(--green)}
.st-plan{background:var(--info-l);color:var(--info)}
.st-old{background:#eee;color:#888}
.gcard .ed{background:none;border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.box{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:12px}
.box summary{font-weight:600;font-size:14px;color:var(--green)}
.cbx{display:flex!important;gap:8px;align-items:center;color:var(--text)!important;font-size:14px!important}
.logo-up{display:flex;gap:12px;align-items:center}
.logo-up .pv{width:64px;height:64px;border:1.5px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:11px;color:var(--muted);text-align:center}
.logo-up .pv img{max-width:100%;max-height:100%}
.toast{position:sticky;bottom:12px;margin:12px;background:var(--text);color:#fff;padding:12px 14px;border-radius:10px;font-size:13px}
.ph-hint{font-size:12px;color:var(--muted);margin-top:8px}
</style>
</head>
<body>
<div id="tb">
  <b>Klickdummy Empfangsdisplay</b>
  <div class="grp">Display:
    <select id="dsp"><option value="empfang">Empfang Ötztal Bahnhof (Touch)</option><option value="info">Info Ötztal Bahnhof (ohne Touch)</option></select>
  </div>
  <div class="grp">Format:
    <button data-fmt="hoch" class="on">Hochformat</button>
    <button data-fmt="quer">Querformat</button>
  </div>
  <div class="grp">Szenario:
    <select id="scn">
      <option value="standard">Standard (Default-Gruß)</option>
      <option value="gruss">Gruß aktiv</option>
      <option value="team">Team-Seite (z. B. 06:55–07:10)</option>
      <option value="closed">Feierabend / geschlossen (Öffnungszeiten)</option>
      <option value="pause">Mittagspause (Balken)</option>
      <option value="vorwarnung">Vorwarnung vor Schluss (Balken)</option>
      <option value="vorank">Vorankündigung Betriebsurlaub</option>
      <option value="urlaub">Betriebsurlaub (Schließzeit)</option>
    </select>
  </div>
  <div class="grp">Weg-Medium:
    <select id="med"><option value="svg">Animation</option><option value="gif">GIF</option><option value="webp">WebP</option><option value="mp4">MP4</option><option value="none">ohne (normale Seite)</option></select>
  </div>
  <label><input type="checkbox" id="noticeOn"> Hinweis „Fr ab 12:00“ aktiv</label>
  <label><input type="checkbox" id="teamInt" checked> Team-Seite: Wegweiser zugänglich</label>
  <div class="grp">Rücksprung nach:
    <select id="to"><option value="20" selected>20 s (Demo)</option><option value="45">45 s</option><option value="60">60 s</option></select>
  </div>
  <label><input type="checkbox" id="adm" checked> Pflegemaske (Handy)</label>
</div>
<div id="stage">
  <div id="dispWrap"><div id="screen"></div></div>
  <div id="phoneWrap"><div id="phone"></div></div>
</div>

  if(!ns.length) return '';

    var main=S.lang==='en'&&n.text_en?n.text_en:n.text, other=S.lang==='en'?n.text:n.text_en;

function fit(){
  var kiosk=document.body.classList.contains('kiosk');
  var phoneOn=!kiosk&&document.getElementById('adm').checked;
  document.getElementById('phoneWrap').style.display=phoneOn?'block':'none';
  var tbH=kiosk?0:document.getElementById('tb').offsetHeight+32;
  var aw=window.innerWidth-(kiosk?0:32)-(phoneOn?414:0)-(kiosk?0:20);
  var ah=window.innerHeight-tbH-(kiosk?0:20);
  var s=Math.min(aw/W,ah/H);
  var sc=document.getElementById('screen');
  sc.style.transform='scale('+s+')';
  var w=document.getElementById('dispWrap'); w.style.width=Math.floor(W*s)+'px'; w.style.height=Math.floor(H*s)+'px';
}

},250);

    if(A.tab==='news'){
      S.news.forEach(function(n,i){
        var d=isoDate(new Date()), st=n.toD<d?'<span class="st-chip st-old">abgelaufen</span>':n.fromD>d?'<span class="st-chip st-plan">geplant</span>':'<span class="st-chip st-run">läuft</span>';
        h+='<div class="gcard"><div class="th" style="font-size:10px;color:var(--muted)">'+(n.img?'<img src="'+n.img+'">':'Bild')+'</div><div class="in"><div class="nm">'+esc(n.title)+'</div><div class="zt">'+fmtD(n.fromD)+' – '+fmtD(n.toD)+' · '+(n.slide?'Folie':'')+(n.slide&&n.ticker?' + ':'')+(n.ticker?'Laufband':'')+'</div><div class="zt">'+(n.sites.length===SITES.length?'alle Standorte':n.sites.map(function(id){return SITES.filter(function(x){return x.id===id})[0].n}).join(', '))+'</div>'+st+'</div><button class="ed" data-a="wedit" data-i="'+i+'">Bearbeiten</button></div>';
      });
      h+='<div class="ph-hint">News erscheinen nur auf internen Info-Displays der gewählten Standorte – nicht auf Empfangsdisplays.</div></div>';
    } else if(A.tab==='hinweis'){
      S.notices.forEach(function(n,i){
        h+='<div class="gcard"><div class="th" style="background:#b86e00;border:none">'+nIcon(n.icon)+'</div><div class="in"><div class="nm">'+esc(n.text)+'</div><div class="zt">'+nRule(n)+'</div><div class="zt">'+n.displays.map(dName).join(', ')+'</div><span class="st-chip '+(n.active?'st-run':'st-old')+'">'+(n.active?'aktiv':'pausiert')+'</span></div><button class="ed" data-a="nedit" data-i="'+i+'">Bearbeiten</button></div>';
      });
      h+='<div class="ph-hint">Hinweise erscheinen als Balken über dem Wegweiser – nur auf den gewählten Displays und nur im eingestellten Zeitfenster.</div></div>';
    } else {
    S.greetings.forEach(function(g,i){
      h+='<div class="gcard"><div class="th">'+guestLogo(g)+'</div><div class="in"><div class="nm">'+esc(g.name)+'</div><div class="zt">'+fmtD(g.fromD)+' '+g.fromT+' – '+fmtD(g.toD)+' '+g.toT+(g.daily?' · täglich':'')+'</div>'+status(g)+'</div><button class="ed" data-a="edit" data-i="'+i+'">Bearbeiten</button></div>';
    });
    h+='<div class="ph-hint">Außerhalb aller Zeiträume zeigt das Display automatisch den Standardgruß „Willkommen bei Holz Marberger“.</div></div>';
    }
    if(A.toast) h+='<div class="toast">'+A.toast+'</div>';
  } else if(A.view==='wform'){
    var w=A.editIdx>=0?S.news[A.editIdx]:{title:'',text:'',img:null,fromD:isoDate(new Date()),toD:isoDate(new Date(Date.now()+86400000*7)),sites:['oetztal'],slide:true,ticker:true};
    var wl=A.logo!==null?A.logo:w.img;
    h='<div class="ph-top"><h4>'+(A.editIdx>=0?'News bearbeiten':'Neue News')+'</h4><button data-a="cancel">✕</button></div><div class="ph-body">'+
      '<label>Titel *</label><input type="text" id="w_t" value="'+esc(w.title)+'">'+
      '<label>Text</label><textarea id="w_x" rows="4" style="width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;font:inherit">'+esc(w.text)+'</textarea>'+
      '<label>Bild</label><div class="logo-up"><div class="pv">'+(wl?'<img src="'+wl+'">':'kein Bild')+'</div><div><input type="file" id="lf" accept="image/*" style="font-size:12px;width:100%"></div></div>'+
      '<div class="box"><b style="font-size:14px;color:var(--green)">Gültig</b><div class="row2"><div><label>Von</label><input type="date" id="w_f" value="'+w.fromD+'"></div><div><label>Bis</label><input type="date" id="w_to" value="'+w.toD+'"></div></div></div>'+
      '<div class="box"><b style="font-size:14px;color:var(--green)">Standorte</b>'+SITES.map(function(x){return '<label class="cbx"><input type="checkbox" class="w_site" value="'+x.id+'"'+(w.sites.indexOf(x.id)>=0?' checked':'')+'> '+x.n+'</label>'}).join('')+'</div>'+
      '<div class="box"><b style="font-size:14px;color:var(--green)">Anzeige</b><label class="cbx"><input type="checkbox" id="w_sl"'+(w.slide?' checked':'')+'> Als eigene Folie in der Abfolge</label><label class="cbx"><input type="checkbox" id="w_tk"'+(w.ticker?' checked':'')+'> Im Laufband</label></div>'+
      '<button class="btn" data-a="wsave">Speichern</button>'+(A.editIdx>=0?'<button class="btn sec" data-a="wdel">Löschen</button>':'')+'<button class="btn sec" data-a="cancel">Abbrechen</button></div>';
  } else if(A.view==='nform'){
    var nn=A.editIdx>=0?S.notices[A.editIdx]:{text:'',text_en:'',icon:'right',days:[5],from:'12:00',untilClose:true,to:'17:00',displays:['eingang-oetztal'],active:true};
    var DN=[[1,'Mo'],[2,'Di'],[3,'Mi'],[4,'Do'],[5,'Fr'],[6,'Sa'],[0,'So']];
    h='<div class="ph-top"><h4>'+(A.editIdx>=0?'Hinweis bearbeiten':'Neuer Hinweis')+'</h4><button data-a="cancel">✕</button></div><div class="ph-body">'+
      '<label>Text (Deutsch) *</label><input type="text" id="n_t" value="'+esc(nn.text)+'">'+
      '<label>Text (Englisch)</label><input type="text" id="n_te" value="'+esc(nn.text_en)+'">'+
      '<label>Symbol</label><div class="chips" id="n_ic">'+Object.keys(NICON).map(function(k){return '<button class="chip ic'+(nn.icon===k?' on':'')+'" data-a="nicon" data-k="'+k+'">'+nIcon(k,'#006729')+'</button>'}).join('')+'</div>'+
      '<div class="box"><b style="font-size:14px;color:var(--green)">Wann</b><label>Wochentage</label><div class="chips" id="n_days">'+DN.map(function(d){return '<button class="chip'+(nn.days.indexOf(d[0])>=0?' on':'')+'" data-a="nday" data-k="'+d[0]+'">'+d[1]+'</button>'}).join('')+'</div>'+
      '<div class="row2"><div><label>Von</label><input type="time" id="n_f" value="'+nn.from+'"></div><div><label>Bis (Uhrzeit)</label><input type="time" id="n_to" value="'+nn.to+'"></div></div>'+
      '<label class="cbx"><input type="checkbox" id="n_uc"'+(nn.untilClose?' checked':'')+'> Bis Geschäftsschluss (laut Öffnungszeiten)</label>'+
      '<div class="ph-hint">Optional zusätzlich: gültig von/bis (z. B. nur während einer Baustelle).</div></div>'+
      '<div class="box"><b style="font-size:14px;color:var(--green)">Anzeigen auf</b>'+DISPLAYS.map(function(d){return '<label class="cbx"><input type="checkbox" class="n_disp" value="'+d.id+'"'+(nn.displays.indexOf(d.id)>=0?' checked':'')+'> '+d.n+'</label>'}).join('')+'</div>'+
      '<label class="cbx" style="margin-top:14px"><input type="checkbox" id="n_a"'+(nn.active?' checked':'')+'> Hinweis aktiv</label>'+
      '<button class="btn" data-a="nsave">Speichern</button>'+(A.editIdx>=0?'<button class="btn sec" data-a="ndel">Löschen</button>':'')+'<button class="btn sec" data-a="cancel">Abbrechen</button></div>';
  } else {
    var g=A.editIdx>=0?S.greetings[A.editIdx]:null, n=new Date();
    var def=g||{kicker:'Herzlich willkommen',name:'',sub:'',kicker_en:'Welcome',sub_en:'',fromD:isoDate(n),fromT:pad(n.getHours())+':00',toD:isoDate(n),toT:pad(Math.min(n.getHours()+3,23))+':00',daily:false,displays:['eingang-oetztal']};
    if(A.tpl){var tp=TPL[A.tpl];def=Object.assign({},def,{kicker:tp.kicker,name:tp.name,sub:tp.sub,kicker_en:tp.kicker_en,sub_en:tp.sub_en})}
    var lg=A.logo!==null?A.logo:(g?g.logo:null);
    h='<div class="ph-top"><h4>'+(g?'Gruß bearbeiten':'Neuer Gruß')+'</h4><button data-a="cancel">✕</button></div><div class="ph-body">'+
      '<label>Schnellvorlage</label><div class="chips">'+Object.keys(TPL).map(function(k){return '<button class="chip'+(A.tpl===k?' on':'')+'" data-a="tpl" data-k="'+k+'">'+TPL[k].label+'</button>'}).join('')+'</div>'+
      '<label>Logo des Gastes</label><div class="logo-up"><div class="pv">'+(lg?'<img src="'+lg+'">':'kein Logo')+'</div><div><input type="file" id="lf" accept="image/*" style="font-size:12px;width:100%"><div class="ph-hint">Foto oder Datei vom Handy</div></div></div>'+
      '<label>Begrüßungszeile</label><input type="text" id="f_k" value="'+esc(def.kicker)+'">'+
      '<label>Name / Gruppe *</label><input type="text" id="f_n" value="'+esc(def.name)+'">'+
      '<label>Zusatzzeile</label><input type="text" id="f_s" value="'+esc(def.sub)+'">'+
      '<details class="box"><summary>Englisch (optional)</summary><label>Begrüßungszeile EN</label><input type="text" id="f_ke" value="'+esc(def.kicker_en)+'"><label>Zusatzzeile EN</label><input type="text" id="f_se" value="'+esc(def.sub_en)+'"></details>'+
      '<div class="box"><b style="font-size:14px;color:var(--green)">Zeitraum</b>'+
      '<div class="row2"><div><label>Von Tag</label><input type="date" id="f_fd" value="'+def.fromD+'"></div><div><label>Startzeit</label><input type="time" id="f_ft" value="'+def.fromT+'"></div></div>'+
      '<div class="row2"><div><label>Bis Tag</label><input type="date" id="f_td" value="'+def.toD+'"></div><div><label>Endzeit</label><input type="time" id="f_tt" value="'+def.toT+'"></div></div>'+
      '<label class="cbx"><input type="checkbox" id="f_d"'+(def.daily?' checked':'')+'> Bei mehreren Tagen: nur täglich von Start- bis Endzeit</label></div>'+
      '<div class="box"><b style="font-size:14px;color:var(--green)">Anzeigen auf</b>'+DISPLAYS.filter(function(d){return d.typ==='empfang'}).map(function(d){return '<label class="cbx"><input type="checkbox" class="f_disp" value="'+d.id+'"'+(def.displays.indexOf(d.id)>=0?' checked':'')+'> '+d.n+'</label>'}).join('')+'</div>'+
      '<button class="btn" data-a="save">Speichern</button>'+(g?'<button class="btn sec" data-a="del">Löschen</button>':'')+'<button class="btn sec" data-a="cancel">Abbrechen</button></div>';
  }
  P.innerHTML=h;
  var lf=document.getElementById('lf');
  if(lf) lf.onchange=function(){var f=lf.files[0];if(!f)return;var r=new FileReader();r.onload=function(){A.logo=r.result;if(A.view==='form'){keepForm();phoneRender();restoreForm()}else{var pv=document.querySelector('.logo-up .pv');pv.innerHTML='<img src="'+r.result+'">'}};r.readAsDataURL(f)};
}
var formCache=null;
function v(id){var e=document.getElementById(id);return e?e.value:''}
function keepForm(){formCache={k:v('f_k'),n:v('f_n'),s:v('f_s'),ke:v('f_ke'),se:v('f_se'),fd:v('f_fd'),ft:v('f_ft'),td:v('f_td'),tt:v('f_tt'),d:document.getElementById('f_d').checked}}
function restoreForm(){if(!formCache)return;var m={f_k:'k',f_n:'n',f_s:'s',f_ke:'ke',f_se:'se',f_fd:'fd',f_ft:'ft',f_td:'td',f_tt:'tt'};Object.keys(m).forEach(function(id){document.getElementById(id).value=formCache[m[id]]});document.getElementById('f_d').checked=formCache.d;formCache=null}
document.getElementById('phone').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b||!b.dataset.a) return; var A=S.admin, a=b.dataset.a;
  if(a==='login'){if(!v('pw')){document.getElementById('pw').style.borderColor='#922224';return}A.logged=true;A.view='list'}
  else if(a==='new'){A.view='form';A.editIdx=-1;A.tpl=null;A.logo=null;A.toast=''}
  else if(a==='edit'){A.view='form';A.editIdx=+b.dataset.i;A.tpl=null;A.logo=null;A.toast=''}
  else if(a==='cancel'){A.view='list'}
  else if(a==='tab'){A.tab=b.dataset.k;A.toast=''}
  else if(a==='wnew'){A.view='wform';A.editIdx=-1;A.logo=null;A.toast=''}
  else if(a==='wedit'){A.view='wform';A.editIdx=+b.dataset.i;A.logo=null;A.toast=''}
  else if(a==='wdel'){S.news.splice(A.editIdx,1);A.view='list';A.toast='Gelöscht.';render()}
  else if(a==='wsave'){
    if(!v('w_t').trim()){document.getElementById('w_t').style.borderColor='#922224';return}
    var old=A.editIdx>=0?S.news[A.editIdx]:null;
    var nw={title:v('w_t'),text:document.getElementById('w_x').value,img:A.logo!==null?A.logo:(old?old.img:null),fromD:v('w_f'),toD:v('w_to'),
      sites:[].map.call(document.querySelectorAll('.w_site:checked'),function(x){return x.value}),slide:document.getElementById('w_sl').checked,ticker:document.getElementById('w_tk').checked};
    if(old) S.news[A.editIdx]=nw; else S.news.unshift(nw);
    A.view='list'; A.toast='Gespeichert. Sichtbar auf dem Info-Display (Auswahl „Display: Info“ oben).'; render();
  }
  else if(a==='nnew'){A.view='nform';A.editIdx=-1;A.toast=''}
  else if(a==='nedit'){A.view='nform';A.editIdx=+b.dataset.i;A.toast=''}
  else if(a==='nicon'){[].forEach.call(document.querySelectorAll('#n_ic .chip'),function(c){c.classList.remove('on')});b.classList.add('on');return}
  else if(a==='nday'){b.classList.toggle('on');return}
  else if(a==='ndel'){S.notices.splice(A.editIdx,1);A.view='list';A.toast='Gelöscht.';render()}
  else if(a==='nsave'){
    if(!v('n_t').trim()){document.getElementById('n_t').style.borderColor='#922224';return}
    var nb={text:v('n_t'),text_en:v('n_te'),icon:(document.querySelector('#n_ic .chip.on')||{dataset:{k:'info'}}).dataset.k,
      days:[].map.call(document.querySelectorAll('#n_days .chip.on'),function(c){return +c.dataset.k}),from:v('n_f'),to:v('n_to'),
      untilClose:document.getElementById('n_uc').checked,displays:[].map.call(document.querySelectorAll('.n_disp:checked'),function(x){return x.value}),
      active:document.getElementById('n_a').checked};
    if(A.editIdx>=0) S.notices[A.editIdx]=nb; else S.notices.unshift(nb);
    S.noticeOn=true; A.view='list'; A.toast='Gespeichert. Im Dummy wird der Hinweis sofort angezeigt (in echt nur im Zeitfenster).'; render();
  }
  else if(a==='tpl'){A.tpl=b.dataset.k}
  else if(a==='del'){S.greetings.splice(A.editIdx,1);if(S.scenario==='gruss')S.greeting=S.greetings[0]||null;A.view='list';A.toast='Gelöscht.';render()}
  else if(a==='save'){
    if(!v('f_n').trim()){document.getElementById('f_n').style.borderColor='#922224';return}
    var old=A.editIdx>=0?S.greetings[A.editIdx]:null;
    var g={kicker:v('f_k'),name:v('f_n'),sub:v('f_s'),kicker_en:v('f_ke'),sub_en:v('f_se'),logo:A.logo!==null?A.logo:(old?old.logo:null),
      fromD:v('f_fd'),fromT:v('f_ft'),toD:v('f_td'),toT:v('f_tt'),daily:document.getElementById('f_d').checked,
      displays:[].slice.call(document.querySelectorAll('.f_disp:checked')).map(function(x){return x.value})};
    if(old) S.greetings[A.editIdx]=g; else S.greetings.unshift(g);
    S.greeting=g; S.scenario='gruss'; S.teamDismissed=false;
    A.view='list'; A.toast='Gespeichert – erscheint am Display binnen 60 s. (Im Dummy sofort als Vorschau.)';
    render();
  }
  if(a==='tpl'){phoneRender();return}
  phoneRender();
});
render(); phoneRender();
})();
</script>
</body>
</html>
